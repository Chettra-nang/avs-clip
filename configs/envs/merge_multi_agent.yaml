id: merge-multi-agent-v0
render_mode: rgb_array

# Custom multi-agent merge environment
# This uses our custom MultiAgentMergeEnv that properly supports 4 controlled vehicles

# Heterogeneous agent configuration
heterogeneous_agents: true
agent_roles:
  - ambulance
  - normal
  - normal
  - normal

# Visual distinction for agent roles
agent_colors:
  ambulance: [255, 0, 0]  # Red
  normal: [0, 255, 0]     # Green
  npc: [0, 0, 255]        # Blue

config:
  observation:
    type: MultiAgentObservation
    observation_config:
      type: Kinematics
      vehicles_count: 8
      features: [presence, x, y, vx, vy, cos_h, sin_h]
      absolute: true
      flatten: true
  action:
    type: MultiAgentAction
    action_config:
      type: DiscreteMetaAction
      lateral: true
      longitudinal: true
  controlled_vehicles: 4
  vehicles_count: 8  # Reduced traffic density
  duration: 40
  # Rendering settings (square aspect ratio to match highway/intersection)
  scaling: 7.0
  screen_width: 600
  screen_height: 600  # Changed from 150 to 600 for square aspect ratio
  centering_position: [0.3, 0.5]
  collision_reward: -1
  right_lane_reward: 0.1
  high_speed_reward: 0.4
  merging_speed_reward: -0.5
  lane_change_reward: -0.05
  reward_speed_range: [20, 30]
  normalize_reward: true
  offroad_terminal: false
