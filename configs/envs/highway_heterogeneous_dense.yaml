id: highway-v0
render_mode: rgb_array

# Heterogeneous agent configuration - DENSE variant for more interactions
heterogeneous_agents: true
agent_roles:
  - ambulance
  - normal
  - normal
  - normal

# Visual distinction for agent roles
agent_colors:
  ambulance: [255, 0, 0]  # Red
  normal: [0, 255, 0]     # Green
  npc: [0, 0, 255]        # Blue

config:
  observation:
    type: MultiAgentObservation
    observation_config:
      type: Kinematics
      vehicles_count: 8
      # Features: standard kinematics (role encoding added programmatically)
      # Note: role feature (0.0=ambulance, 1.0=normal, 2.0=NPC) is added
      # via add_role_encoding() in data collection and training pipelines
      features: [presence, x, y, vx, vy, cos_h, sin_h]
      absolute: true
      flatten: true
  action:
    type: MultiAgentAction
    action_config:
      type: DiscreteMetaAction
      lateral: true
      longitudinal: true
  controlled_vehicles: 4
  lanes_count: 4
  vehicles_count: 60  # More traffic for denser scenarios
  duration: 60        # Longer episodes for catch-up time
  initial_spacing: 0.5  # Tighter spacing (~50-100m separation)
  ego_spacing: 0.05     # Very close initial spawn
  scaling: 12.0
  screen_width: 600
  screen_height: 600
  collision_reward: -1
  right_lane_reward: 0.1
  high_speed_reward: 0.4
  lane_change_reward: 0
  reward_speed_range: [20, 30]
  normalize_reward: true
  offroad_terminal: false
