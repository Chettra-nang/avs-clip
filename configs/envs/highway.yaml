id: highway-v0
render_mode: rgb_array
config:
  observation:
    type: MultiAgentObservation
    observation_config:
      type: Kinematics
      vehicles_count: 8
      # Features: role encoding prepended to standard kinematics
      # role: 0.0=ambulance, 1.0=normal, 2.0=NPC (added for heterogeneous mode)
      # Note: role feature is added programmatically via add_role_encoding()
      features: [presence, x, y, vx, vy, cos_h, sin_h]
      absolute: true
      flatten: true
  action:
    type: MultiAgentAction
    action_config:
      type: DiscreteMetaAction
      lateral: true
      longitudinal: true
  controlled_vehicles: 4
  lanes_count: 4
  vehicles_count: 50
  duration: 40
  initial_spacing: 2
  ego_spacing: 0.15
  scaling: 12.0
  screen_width: 600
  screen_height: 600
  collision_reward: -1
  right_lane_reward: 0.1
  high_speed_reward: 0.4
  lane_change_reward: 0
  reward_speed_range: [20, 30]
  normalize_reward: true
  offroad_terminal: false
