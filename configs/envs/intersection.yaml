id_candidates: [intersection-v1, intersection-v0]
render_mode: rgb_array
config:
  observation:
    type: MultiAgentObservation
    observation_config:
      type: Kinematics
      vehicles_count: 8
      features: [presence, x, y, vx, vy, cos_h, sin_h]
      absolute: true
      flatten: true
  action:
    type: MultiAgentAction
    action_config:
      type: DiscreteMetaAction
      lateral: true
      longitudinal: true
  controlled_vehicles: 4
  spawn_probability: 0.6
  vehicles_count: 50
  duration: 40
  collision_reward: -5
  high_speed_reward: 1
  arrived_reward: 1
  reward_speed_range: [7.0, 9.0]
  normalize_reward: true
  offroad_terminal: false
